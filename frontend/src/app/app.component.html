<nav class="navbar" *ngIf="authService.isAuthenticated()">
  <div class="nav-container">
    <a routerLink="/dashboard" class="nav-brand">Investment Tracker</a>
    <button
      type="button"
      class="nav-toggle"
      (click)="menuOpen = !menuOpen"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-menu" [class.open]="menuOpen">
      <li class="nav-item nav-group" [class.open]="openGroup === 'portfolio'">
        <button type="button" class="nav-group-btn" (click)="toggleGroup('portfolio')">Portfolio</button>
        <ul class="nav-dropdown">
          <li><a routerLink="/dashboard" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Dashboard</a></li>
          <li><a routerLink="/investments" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Investments</a></li>
          <li><a routerLink="/cashflows" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Cashflows</a></li>
          <li><a routerLink="/investment-summary" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Summary</a></li>
        </ul>
      </li>
      <li class="nav-item nav-group" [class.open]="openGroup === 'insights'">
        <button type="button" class="nav-group-btn" (click)="toggleGroup('insights')">Insights</button>
        <ul class="nav-dropdown">
          <li><a routerLink="/analytics" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Analytics</a></li>
          <li><a routerLink="/asset-tracker" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Asset Tracker</a></li>
        </ul>
      </li>
      <li class="nav-item">
        <a routerLink="/banking" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Bank</a>
      </li>
      <li class="nav-item nav-group" [class.open]="openGroup === 'data'">
        <button type="button" class="nav-group-btn" (click)="toggleGroup('data')">Data</button>
        <ul class="nav-dropdown">
          <li><a routerLink="/import-data" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Import statements</a></li>
          <li><a routerLink="/import-export" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Backup &amp; restore</a></li>
        </ul>
      </li>
      <li class="nav-item">
        <button type="button" (click)="logout()" class="logout-btn">Logout</button>
      </li>
    </ul>
  </div>
</nav>

<main class="main-content" [class.no-nav]="!authService.isAuthenticated()">
  <router-outlet />
</main>
