<section class="workspace">
  <div class="workspace-head">
    <div>
      <h3>People &amp; portfolios</h3>
      <p>
        Choose a portfolio to filter investments, banking, and charts.
        With <strong>All portfolios</strong> selected, new holdings are saved to {{ writeName }}.
        Create users and portfolios under <a routerLink="/workspace">Workspace</a>.
      </p>
    </div>
    <div class="workspace-actions">
      <a routerLink="/workspace" class="text-btn link-btn">Manage workspace</a>
      <button type="button" class="text-btn" (click)="reload()" [disabled]="loading">Refresh list</button>
    </div>
  </div>

  <p class="workspace-error" *ngIf="error">{{ error }}</p>
  <p class="workspace-ok" *ngIf="message">{{ message }}</p>

  <div class="pf-grid" *ngIf="!loading">
    <article class="pf-card all" [class.active]="isActive('all')">
      <button type="button" class="pf-open" (click)="select('all')">
        <span class="pf-kicker">Combined</span>
        <strong class="pf-title">All portfolios</strong>
        <span class="pf-total">₹{{ grandTotal | number:'1.0-0' }}</span>
        <span class="pf-meta">{{ cards.length }} portfolio{{ cards.length === 1 ? '' : 's' }}</span>
      </button>
    </article>

    <article class="pf-card" *ngFor="let card of cards" [class.active]="isActive(card.id)">
      <button type="button" class="pf-open" (click)="select(card.id)">
        <span class="swatch" [style.background]="card.color"></span>
        <span class="pf-kicker">{{ card.owner_name || card.owner_username }}</span>
        <strong class="pf-title">{{ card.name }}</strong>
        <span class="pf-total">₹{{ (card.investment_total || 0) | number:'1.0-0' }}</span>
        <span class="pf-meta">
          {{ card.investment_count || 0 }} holdings · {{ card.account_count || 0 }} accounts
          <span *ngIf="card.is_default"> · default</span>
        </span>
      </button>
    </article>
  </div>
</section>
